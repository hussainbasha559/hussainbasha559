<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Shaik Hussainbasha - AI/ML and Software Development" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.5" stop-color="#0d0221"/>
      <stop offset="1" stop-color="#0a1a4a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="1" stop-color="#bd00ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00f5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00f5ff" stroke-opacity="0.12"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="300" rx="14"/></clipPath>
  </defs>
  <style>
    .code{font-family:Consolas,'Courier New',monospace;font-size:14px;white-space:pre}
    .k{fill:#bd00ff}.f{fill:#00f5ff}.s{fill:#7dffb0}.c{fill:#6b7a99}.t{fill:#e6edf3}
    .name{font-family:'Courier New',monospace;font-size:50px;font-weight:700;letter-spacing:2px}
    .sub{font-family:'Courier New',monospace;font-size:18px;fill:#9fb3d9}
    .bar{font-family:'Courier New',monospace;font-size:12px;fill:#6b7a99}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .drift{animation:drift 8s ease-in-out infinite alternate}
    @keyframes drift{from{transform:translateY(0)}to{transform:translateY(-10px)}}
  </style>
  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect width="1000" height="300" fill="url(#glow)"/>

    <g class="drift" opacity="0.5">
      <text class="code" x="24" y="80"><tspan class="k">import</tspan> <tspan class="t">pandas</tspan> <tspan class="k">as</tspan> <tspan class="t">pd</tspan></text>
      <text class="code" x="24" y="102"><tspan class="k">from</tspan> <tspan class="t">sklearn.ensemble</tspan> <tspan class="k">import</tspan> <tspan class="f">RandomForestClassifier</tspan></text>
      <text class="code" x="24" y="124"><tspan class="t">model</tspan> = <tspan class="f">RandomForestClassifier</tspan>()</text>
      <text class="code" x="24" y="146"><tspan class="t">model</tspan>.<tspan class="f">fit</tspan>(X_train, y_train)</text>
      <text class="code" x="24" y="190"><tspan class="c"># local LLM with Ollama</tspan></text>
      <text class="code" x="24" y="212"><tspan class="t">reply</tspan> = ollama.<tspan class="f">chat</tspan>(model=<tspan class="s">"llama3"</tspan>)</text>
      <text class="code" x="24" y="256"><tspan class="k">while</tspan> <tspan class="t">learning</tspan>: <tspan class="t">grow</tspan>()</text>

      <text class="code" x="640" y="80"><tspan class="k">def</tspan> <tspan class="f">solve</tspan>(nums):</text>
      <text class="code" x="640" y="102">    <tspan class="k">return</tspan> <tspan class="f">sorted</tspan>(nums)</text>
      <text class="code" x="640" y="146"><tspan class="k">class</tspan> <tspan class="f">Developer</tspan>:</text>
      <text class="code" x="640" y="168">    stack = [<tspan class="s">"Python"</tspan>, <tspan class="s">"Node.js"</tspan>]</text>
      <text class="code" x="640" y="190">    goal  = <tspan class="s">"AI/ML Engineer"</tspan></text>
      <text class="code" x="640" y="234"><tspan class="k">const</tspan> <tspan class="t">res</tspan> = <tspan class="k">await</tspan> <tspan class="f">fetch</tspan>(api);</text>
      <text class="code" x="640" y="256"><tspan class="t">console</tspan>.<tspan class="f">log</tspan>(<tspan class="s">"Hello, World"</tspan>);</text>
    </g>

    <rect x="0" y="0" width="1000" height="34" fill="#05060f" fill-opacity="0.85"/>
    <circle cx="20" cy="17" r="5.5" fill="#ff5f56"/>
    <circle cx="40" cy="17" r="5.5" fill="#ffbd2e"/>
    <circle cx="60" cy="17" r="5.5" fill="#27c93f"/>
    <text class="bar" x="500" y="21" text-anchor="middle">hussainbasha559 ~ profile.py</text>
    <line x1="0" y1="34" x2="1000" y2="34" stroke="#00f5ff" stroke-opacity="0.25"/>

    <rect x="150" y="92" width="700" height="130" rx="10" fill="#000000" fill-opacity="0.45" stroke="#00f5ff" stroke-opacity="0.25"/>
    <text class="name" x="500" y="152" text-anchor="middle" fill="url(#title)" filter="url(#neon)">Shaik Hussainbasha</text>
    <text class="sub" x="500" y="192" text-anchor="middle">AI/ML  |  Local LLMs  |  Software Development<tspan class="cur" fill="#00f5ff">_</tspan></text>
  </g>
</svg>
